services:
  postgres:
    image: postgres:15-alpine
    container_name: locadora-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: locadora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: locadora-api
#    network_mode: "bridge" #
    network_mode: "host" # Permite que a API use o 'localhost' da sua máquina física
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DATABASE=${REDIS_DATABASE}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    # depends_on: # Comentado para permitir rodar a API isoladamente contra o seu banco local
    #   - postgres
    #   - redis

volumes:
  postgres_data:
  redis_data:

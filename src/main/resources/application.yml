spring:
  application:
    name: locadora-system
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/locadora_db
    username: ${DB_USERNAME:locadora_user}
    password: ${DB_PASSWORD:locadora_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

omdb:
  api:
    key: ${OMDB_API_KEY}
    url: http://www.omdbapi.com/

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

logging:
  level:
    com.locadora: DEBUG
    org.springframework.security: INFO
